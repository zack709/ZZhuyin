name: Build & Release ZZhuyin Installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 0.1.1, defaults to CMakeLists.txt version)'
        required: false
        default: ''
      publish_release:
        description: 'Publish installers to GitHub Release (tag v<version>)'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  build-installers:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Determine version
        id: ver
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version }}"
          if (-not $version -and "${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}" -replace '^v', ''
          }
          if (-not $version) {
            $cmake = Get-Content CMakeLists.txt -Raw
            if ($cmake -match 'project\(ZZhuyin\s+VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)') {
              $version = $Matches[1]
            } else {
              $version = "0.1.5"
            }
          }
          echo "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building ZZhuyin version: $version"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build open-source zzhuyin.zdict (libchewing-data)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          python tools/build_zdict.py --fetch-chewing -o dist/zzhuyin.zdict

      - name: Build & Test Release x64
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL (
            echo Visual Studio C++ tools not found!
            exit /b 1
          )
          echo Using Visual Studio at: %VSINSTALL%
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cmake -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release || exit /b 1
          cmake --build build-release || exit /b 1
          ctest --test-dir build-release --output-on-failure || exit /b 1

      - name: Build & Test Release x86
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL (
            echo Visual Studio C++ tools not found!
            exit /b 1
          )
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars32.bat" || exit /b 1
          cmake -B build-release-x86 -G Ninja -DCMAKE_BUILD_TYPE=Release || exit /b 1
          cmake --build build-release-x86 || exit /b 1
          ctest --test-dir build-release-x86 --output-on-failure || exit /b 1

      - name: Build Release arm64
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL (
            for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set "VSINSTALL=%%i"
          )
          if not defined VSINSTALL (
            echo Visual Studio C++ tools not found!
            exit /b 1
          )
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvarsall.bat" amd64_arm64 || exit /b 1
          cmake -B build-release-arm64 -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_SYSTEM_NAME=Windows -DCMAKE_SYSTEM_PROCESSOR=ARM64 || exit /b 1
          cmake --build build-release-arm64 || exit /b 1

      - name: Locate or install Inno Setup
        id: inno
        shell: pwsh
        run: |
          $iscc = Get-Command iscc.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          if (-not $iscc) {
            $candidates = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
            )
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            throw "ISCC.exe not found!"
          }
          echo "iscc=$iscc" >> $env:GITHUB_OUTPUT

      - name: Package x64 (x64+x86) Installer
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          & "${{ steps.inno.outputs.iscc }}" `
            "/DArch=x64" `
            "/DAppVersion=$ver" `
            "/DBuildDir=..\build-release" `
            "/DBuildDirX86=..\build-release-x86" `
            "/DZDictFile=..\dist\zzhuyin.zdict" `
            "/Odist" `
            "installer\zzhuyin.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package x86 Installer
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          & "${{ steps.inno.outputs.iscc }}" `
            "/DArch=x86" `
            "/DAppVersion=$ver" `
            "/DBuildDir=..\build-release-x86" `
            "/DZDictFile=..\dist\zzhuyin.zdict" `
            "/Odist" `
            "installer\zzhuyin.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package arm64 Installer
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          & "${{ steps.inno.outputs.iscc }}" `
            "/DArch=arm64" `
            "/DAppVersion=$ver" `
            "/DBuildDir=..\build-release-arm64" `
            "/DZDictFile=..\dist\zzhuyin.zdict" `
            "/Odist" `
            "installer\zzhuyin.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Installer Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ZZhuyin-Installers-${{ steps.ver.outputs.version }}
          path: |
            dist/ZZhuyin-Setup-*-x64.exe
            dist/ZZhuyin-Setup-*-x86.exe
            dist/ZZhuyin-Setup-*-arm64.exe

      - name: Publish GitHub Release
        if: inputs.publish_release == true
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Z注音 v${{ steps.ver.outputs.version }}
          files: |
            dist/ZZhuyin-Setup-*-x64.exe
            dist/ZZhuyin-Setup-*-x86.exe
            dist/ZZhuyin-Setup-*-arm64.exe
          generate_release_notes: true
